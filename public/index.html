<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Commerce Store</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; max-width: 900px; }
      section { border: 1px solid #ccc; padding: 16px; margin-bottom: 16px; border-radius: 8px; }
      input, button, textarea { margin: 4px 0; padding: 6px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
      .card { border: 1px solid #ddd; padding: 10px; border-radius: 6px; }
      code { background: #f5f5f5; padding: 2px 4px; }
    </style>
  </head>
  <body>
    <h1>E-Commerce Web Application</h1>

    <section>
      <h2>1) Register / Login</h2>
      <input id="name" placeholder="Name" />
      <input id="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <button onclick="register()">Register</button>
      <button onclick="login()">Login</button>
      <p id="authStatus"></p>
    </section>

    <section>
      <h2>2) Products</h2>
      <p>Admins can create products. All users can browse products and add them to cart.</p>
      <input id="productName" placeholder="Product name" />
      <textarea id="productDescription" placeholder="Description"></textarea>
      <input id="productPrice" type="number" placeholder="Price" />
      <input id="productStock" type="number" placeholder="Stock" />
      <button onclick="createProduct()">Create Product (Admin)</button>
      <button onclick="loadProducts()">Refresh Products</button>
      <div id="products" class="grid"></div>
    </section>

    <section>
      <h2>3) Cart & Checkout</h2>
      <button onclick="loadCart()">View Cart</button>
      <button onclick="checkout()">Checkout</button>
      <pre id="cart"></pre>
    </section>

    <section>
      <h2>4) Order Tracking</h2>
      <button onclick="loadOrders()">My Orders</button>
      <pre id="orders"></pre>
    </section>

    <script>
      const state = { token: '', role: '' };
      function getApiBaseUrl() {
        const fromGlobal = window.API_BASE_URL;
        if (fromGlobal) return fromGlobal;

        const fromStorage = localStorage.getItem('API_BASE_URL');
        if (fromStorage) return fromStorage;

        const params = new URLSearchParams(window.location.search);
        return params.get('apiBase') || '';
      }

      function normalizeApiBaseUrl(rawBaseUrl) {
        if (!rawBaseUrl) return '';

        try {
          const parsed = new URL(rawBaseUrl);
          if (!['http:', 'https:'].includes(parsed.protocol)) {
            return '';
          }
          return rawBaseUrl.replace(/\/+$/, '');
        } catch {
          return '';
        }
      }

      const RAW_API_BASE_URL = getApiBaseUrl();
      const API_BASE_URL = normalizeApiBaseUrl(RAW_API_BASE_URL);
      const IS_GITHUB_PAGES = window.location.hostname.endsWith('github.io');

      if (RAW_API_BASE_URL && !API_BASE_URL) {
        const status = document.getElementById('authStatus');
        status.textContent = 'Invalid API base URL. Use a full http(s) URL, e.g. https://your-api.example.com';
        status.style.color = 'red';
      }

      function apiUrl(path) {
        if (!API_BASE_URL && IS_GITHUB_PAGES) {
          const status = document.getElementById('authStatus');
          status.textContent = 'Set API base URL via ?apiBase=, localStorage(API_BASE_URL), or window.API_BASE_URL.';
          status.style.color = 'red';
        }
        return `${API_BASE_URL}${path}`;
      }

      function authHeaders() {
        return state.token ? { Authorization: `Bearer ${state.token}` } : {};
      }

      async function register() {
        const res = await fetch(apiUrl('/api/auth/register'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        await handleAuthResponse(res);
      }

      async function login() {
        const res = await fetch(apiUrl('/api/auth/login'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        await handleAuthResponse(res);
      }

      async function handleAuthResponse(res) {
        const data = await res.json();
        if (!res.ok) {
          document.getElementById('authStatus').textContent = data.message;
          return;
        }

        state.token = data.token;
        state.role = data.user.role;
        document.getElementById('authStatus').textContent = `Logged in as ${data.user.email} (${data.user.role})`;
        loadProducts();
      }

      async function createProduct() {
        const res = await fetch(apiUrl('/api/products'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify({
            name: document.getElementById('productName').value,
            description: document.getElementById('productDescription').value,
            price: Number(document.getElementById('productPrice').value),
            stock: Number(document.getElementById('productStock').value)
          })
        });

        if (!res.ok) {
          const data = await res.json();
          alert(data.message);
          return;
        }

        await loadProducts();
      }

      async function loadProducts() {
        const res = await fetch(apiUrl('/api/products'));
        const products = await res.json();

        const wrapper = document.getElementById('products');
        wrapper.innerHTML = '';

        for (const product of products) {
          const item = document.createElement('div');
          item.className = 'card';
          item.innerHTML = `<h3>${product.name}</h3><p>${product.description || ''}</p><p>Price: $${product.price}</p><p>Stock: ${product.stock}</p>`;

          const addButton = document.createElement('button');
          addButton.textContent = 'Add to cart';
          addButton.onclick = () => addToCart(product._id);
          item.appendChild(addButton);
          wrapper.appendChild(item);
        }
      }

      async function addToCart(productId) {
        const res = await fetch(apiUrl('/api/cart/items'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify({ productId, quantity: 1 })
        });

        if (!res.ok) {
          const data = await res.json();
          alert(data.message);
          return;
        }

        await loadCart();
      }

      async function loadCart() {
        const res = await fetch(apiUrl('/api/cart'), { headers: authHeaders() });
        const cart = await res.json();
        document.getElementById('cart').textContent = JSON.stringify(cart, null, 2);
      }

      async function checkout() {
        const res = await fetch(apiUrl('/api/cart/checkout'), {
          method: 'POST',
          headers: authHeaders()
        });
        const data = await res.json();
        if (!res.ok) {
          alert(data.message);
          return;
        }

        await loadCart();
        await loadOrders();
      }

      async function loadOrders() {
        const res = await fetch(apiUrl('/api/orders'), { headers: authHeaders() });
        const orders = await res.json();
        document.getElementById('orders').textContent = JSON.stringify(orders, null, 2);
      }

      loadProducts();
    </script>
  </body>
</html>
