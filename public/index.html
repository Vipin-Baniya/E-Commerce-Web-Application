<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flipkart Clone | E-Commerce Store</title>
    <style>
      :root {
        --primary: #2874f0;
        --accent: #ffe500;
        --bg: #f1f3f6;
        --card: #ffffff;
        --text: #212121;
        --muted: #616161;
        --success: #388e3c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .topbar {
        background: var(--primary);
        color: #fff;
        padding: 10px 20px;
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .topbar-row {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand {
        font-size: 1.35rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .brand small {
        display: block;
        font-size: 0.7rem;
        color: #dbe9ff;
      }

      .search {
        flex: 1;
        border: 0;
        border-radius: 2px;
        padding: 10px 12px;
        min-width: 160px;
      }

      .top-btn {
        border: 0;
        border-radius: 2px;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .login-btn {
        background: #fff;
        color: var(--primary);
      }

      .cart-btn {
        background: transparent;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.6);
      }

      .layout {
        max-width: 1200px;
        margin: 14px auto;
        padding: 0 12px 20px;
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 14px;
      }

      .card {
        background: var(--card);
        border-radius: 4px;
        padding: 14px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
      }

      .card h2 {
        margin: 0 0 10px;
        font-size: 1.05rem;
      }

      .stack {
        display: grid;
        gap: 8px;
      }

      input,
      textarea,
      button {
        font: inherit;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid #cfd8dc;
        border-radius: 4px;
        padding: 8px 10px;
      }

      textarea {
        min-height: 70px;
        resize: vertical;
      }

      .btn-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button.action {
        border: 0;
        border-radius: 4px;
        padding: 9px 12px;
        font-weight: 700;
        cursor: pointer;
        background: var(--primary);
        color: #fff;
      }

      button.alt {
        background: #f0f4ff;
        color: var(--primary);
      }

      #authStatus {
        margin: 4px 0 0;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .hero {
        background: linear-gradient(125deg, #ffe082, #ffca28);
        min-height: 110px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .hero h1 {
        margin: 0;
        font-size: 1.25rem;
      }

      .hero p {
        margin: 4px 0 0;
        color: #5d4037;
      }

      .pill {
        background: #fff;
        color: #ef6c00;
        border-radius: 16px;
        padding: 8px 12px;
        font-weight: 700;
      }

      .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 10px;
      }

      .product {
        border: 1px solid #eceff1;
        border-radius: 4px;
        padding: 10px;
        display: grid;
        gap: 6px;
      }

      .product h3 {
        margin: 0;
        font-size: 1rem;
      }

      .meta {
        color: var(--muted);
        font-size: 0.86rem;
      }

      .price {
        font-weight: 700;
      }

      .status-card pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        background: #fafafa;
        border: 1px solid #eceff1;
        border-radius: 4px;
        padding: 10px;
      }

      .status-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      .success {
        color: var(--success);
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .topbar-row {
          flex-wrap: wrap;
        }

        .search {
          order: 3;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">flipkart<small>Explore Plus Clone</small></div>
        <input class="search" placeholder="Search for products, brands and more" />
        <button class="top-btn login-btn" onclick="focusLoginForm()">Login</button>
        <button class="top-btn cart-btn" onclick="loadCart()">Cart</button>
      </div>
    </header>

    <main class="layout">
      <aside class="stack">
        <section class="card">
          <h2>Account</h2>
          <div class="stack">
            <input id="name" placeholder="Name" />
            <input id="email" placeholder="Email" />
            <input id="password" type="password" placeholder="Password" />
            <div class="btn-row">
              <button class="action" onclick="register()">Register</button>
              <button class="action alt" onclick="login()">Login</button>
            </div>
            <p id="authStatus"></p>
          </div>
        </section>

        <section class="card">
          <h2>Admin Product Upload</h2>
          <div class="stack">
            <input id="productName" placeholder="Product name" />
            <textarea id="productDescription" placeholder="Description"></textarea>
            <input id="productPrice" type="number" placeholder="Price" />
            <input id="productStock" type="number" placeholder="Stock" />
            <button class="action" onclick="createProduct()">Create Product</button>
          </div>
        </section>
      </aside>

      <section class="stack">
        <section class="card hero">
          <div>
            <h1>Big Savings Days</h1>
            <p>Clone storefront powered by your existing API backend.</p>
          </div>
          <span class="pill">Up to 70% Off</span>
        </section>

        <section class="card">
          <div class="status-head">
            <h2>Products</h2>
            <button class="action alt" onclick="loadProducts()">Refresh Products</button>
          </div>
          <div id="products" class="products-grid"></div>
        </section>

        <section class="card status-card">
          <div class="status-head">
            <h2>Cart & Checkout</h2>
            <div class="btn-row">
              <button class="action alt" onclick="loadCart()">View Cart</button>
              <button class="action" onclick="checkout()">Checkout</button>
            </div>
          </div>
          <pre id="cart"></pre>
        </section>

        <section class="card status-card">
          <div class="status-head">
            <h2>Order Tracking</h2>
            <button class="action alt" onclick="loadOrders()">My Orders</button>
          </div>
          <pre id="orders"></pre>
        </section>
      </section>
    </main>

    <script>
      const state = { token: '', role: '' };

      function getApiBaseUrl() {
        const fromGlobal = window.API_BASE_URL;
        if (fromGlobal) return fromGlobal;

        const fromStorage = localStorage.getItem('API_BASE_URL');
        if (fromStorage) return fromStorage;

        const params = new URLSearchParams(window.location.search);
        return params.get('apiBase') || '';
      }

      function normalizeApiBaseUrl(rawBaseUrl) {
        if (!rawBaseUrl) return '';

        try {
          const parsed = new URL(rawBaseUrl);
          if (!['http:', 'https:'].includes(parsed.protocol)) {
            return '';
          }
          return rawBaseUrl.replace(/\/+$/, '');
        } catch {
          return '';
        }
      }

      const RAW_API_BASE_URL = getApiBaseUrl();
      const API_BASE_URL = normalizeApiBaseUrl(RAW_API_BASE_URL);
      const IS_GITHUB_PAGES = window.location.hostname.endsWith('github.io');
      let lastConfigErrorMessage = '';

      function showConfigError(message) {
        if (lastConfigErrorMessage === message) return;
        const status = document.getElementById('authStatus');
        status.textContent = message;
        status.style.color = 'red';
        lastConfigErrorMessage = message;
      }

      if (RAW_API_BASE_URL && !API_BASE_URL) {
        showConfigError(`Invalid API base URL "${RAW_API_BASE_URL}". Use a full http(s) URL, e.g. https://api.yourapp.com`);
      }

      function apiUrl(path) {
        if (!API_BASE_URL && IS_GITHUB_PAGES) {
          showConfigError('Set API base URL via ?apiBase=..., localStorage key API_BASE_URL, or window.API_BASE_URL.');
          return null;
        }
        return `${API_BASE_URL}${path}`;
      }

      function authHeaders() {
        return state.token ? { Authorization: `Bearer ${state.token}` } : {};
      }

      function setStatus(message, isError = false) {
        const status = document.getElementById('authStatus');
        status.textContent = message;
        status.style.color = isError ? '#d32f2f' : '#388e3c';
      }

      function focusLoginForm() {
        const emailInput = document.getElementById('email');
        if (!emailInput) return;
        emailInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
        emailInput.focus();
      }

      async function register() {
        const url = apiUrl('/api/auth/register');
        if (!url) return;
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        await handleAuthResponse(res);
      }

      async function login() {
        const url = apiUrl('/api/auth/login');
        if (!url) return;
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        await handleAuthResponse(res);
      }

      async function handleAuthResponse(res) {
        const data = await res.json();
        if (!res.ok) {
          setStatus(data.message || 'Authentication failed', true);
          return;
        }

        state.token = data.token;
        state.role = data.user.role;
        setStatus(`Logged in as ${data.user.email} (${data.user.role})`);
        loadProducts();
      }

      async function createProduct() {
        const url = apiUrl('/api/products');
        if (!url) return;
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify({
            name: document.getElementById('productName').value,
            description: document.getElementById('productDescription').value,
            price: Number(document.getElementById('productPrice').value),
            stock: Number(document.getElementById('productStock').value)
          })
        });

        if (!res.ok) {
          const data = await res.json();
          alert(data.message);
          return;
        }

        await loadProducts();
      }

      async function loadProducts() {
        const url = apiUrl('/api/products');
        if (!url) return;
        const res = await fetch(url);
        const products = await res.json();

        const wrapper = document.getElementById('products');
        wrapper.innerHTML = '';

        for (const product of products) {
          const item = document.createElement('div');
          item.className = 'product';

          const name = document.createElement('h3');
          name.textContent = product.name;

          const desc = document.createElement('p');
          desc.className = 'meta';
          desc.textContent = product.description || 'No description available';

          const price = document.createElement('p');
          price.className = 'price';
          price.textContent = `₹${product.price}`;

          const stock = document.createElement('p');
          stock.className = 'meta';
          stock.textContent = `Stock: ${product.stock}`;

          const addButton = document.createElement('button');
          addButton.className = 'action';
          addButton.textContent = 'Add to Cart';
          addButton.onclick = () => addToCart(product._id);

          item.append(name, desc, price, stock, addButton);
          wrapper.appendChild(item);
        }
      }

      async function addToCart(productId) {
        const url = apiUrl('/api/cart/items');
        if (!url) return;
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify({ productId, quantity: 1 })
        });

        if (!res.ok) {
          const data = await res.json();
          alert(data.message);
          return;
        }

        await loadCart();
      }

      async function loadCart() {
        const url = apiUrl('/api/cart');
        if (!url) return;
        const res = await fetch(url, { headers: authHeaders() });
        const cart = await res.json();
        document.getElementById('cart').textContent = JSON.stringify(cart, null, 2);
      }

      async function checkout() {
        const url = apiUrl('/api/cart/checkout');
        if (!url) return;
        const res = await fetch(url, {
          method: 'POST',
          headers: authHeaders()
        });
        const data = await res.json();
        if (!res.ok) {
          alert(data.message);
          return;
        }

        await loadCart();
        await loadOrders();
      }

      async function loadOrders() {
        const url = apiUrl('/api/orders');
        if (!url) return;
        const res = await fetch(url, { headers: authHeaders() });
        const orders = await res.json();
        document.getElementById('orders').textContent = JSON.stringify(orders, null, 2);
      }

      loadProducts();
    </script>
  </body>
</html>
