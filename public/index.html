<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flipkart Clone | E-Commerce Store</title>
    <style>
      :root {
        --primary: #2874f0;
        --accent: #ffe500;
        --bg: #f1f3f6;
        --card: #ffffff;
        --text: #212121;
        --muted: #616161;
        --success: #388e3c;
      }

      body[data-theme='myntra'] {
        --primary: #ff3f6c;
        --accent: #ffd5e0;
        --bg: #fff6f8;
        --card: #ffffff;
        --text: #1f1f1f;
        --muted: #6c6c6c;
        --success: #2e7d32;
      }

      body[data-theme='dark'] {
        --primary: #111827;
        --accent: #374151;
        --bg: #030712;
        --card: #111827;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --success: #34d399;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .topbar {
        background: var(--primary);
        color: #fff;
        padding: 10px 20px;
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .topbar-row {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand {
        font-size: 1.35rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .brand small {
        display: block;
        font-size: 0.7rem;
        color: #dbe9ff;
      }

      .search {
        flex: 1;
        border: 0;
        border-radius: 2px;
        padding: 10px 12px;
        min-width: 160px;
      }

      .top-btn {
        border: 0;
        border-radius: 2px;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .login-btn {
        background: #fff;
        color: var(--primary);
      }

      .cart-btn {
        background: transparent;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.6);
      }

      .theme-btn {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.35);
      }

      .layout {
        max-width: 1200px;
        margin: 14px auto;
        padding: 0 12px 20px;
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 14px;
      }

      .card {
        background: var(--card);
        border-radius: 4px;
        padding: 14px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
      }

      .card h2 {
        margin: 0 0 10px;
        font-size: 1.05rem;
      }

      .stack {
        display: grid;
        gap: 8px;
      }

      input,
      textarea,
      button {
        font: inherit;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid #cfd8dc;
        border-radius: 4px;
        padding: 8px 10px;
      }

      textarea {
        min-height: 70px;
        resize: vertical;
      }

      .btn-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button.action {
        border: 0;
        border-radius: 4px;
        padding: 9px 12px;
        font-weight: 700;
        cursor: pointer;
        background: var(--primary);
        color: #fff;
      }

      button.alt {
        background: #f0f4ff;
        color: var(--primary);
      }

      #authStatus {
        margin: 4px 0 0;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .hero {
        background: linear-gradient(125deg, #ffe082, #ffca28);
        min-height: 110px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .hero h1 {
        margin: 0;
        font-size: 1.25rem;
      }

      .hero p {
        margin: 4px 0 0;
        color: #5d4037;
      }

      .pill {
        background: #fff;
        color: #ef6c00;
        border-radius: 16px;
        padding: 8px 12px;
        font-weight: 700;
      }

      .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 10px;
      }

      .product {
        border: 1px solid #eceff1;
        border-radius: 4px;
        padding: 10px;
        display: grid;
        gap: 6px;
      }

      .product h3 {
        margin: 0;
        font-size: 1rem;
      }

      .meta {
        color: var(--muted);
        font-size: 0.86rem;
      }

      .search-summary {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .price {
        font-weight: 700;
      }

      .status-card pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        background: #fafafa;
        border: 1px solid #eceff1;
        border-radius: 4px;
        padding: 10px;
      }

      .status-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      .success {
        color: var(--success);
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .topbar-row {
          flex-wrap: wrap;
        }

        .search {
          order: 3;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">flipkart<small>Explore Plus Clone</small></div>
        <input id="searchInput" class="search" placeholder="Search for products, brands and more" aria-label="Search for products, brands and more" oninput="handleSearch()" />
        <button id="themeToggle" class="top-btn theme-btn" onclick="cycleTheme()">Theme</button>
        <button class="top-btn login-btn" onclick="focusEmailInput()">Login</button>
        <button class="top-btn cart-btn" onclick="loadCart()">Cart</button>
      </div>
    </header>

    <main class="layout">
      <aside class="stack">
        <section class="card">
          <h2>Account</h2>
          <div class="stack">
            <input id="name" placeholder="Name" />
            <input id="email" placeholder="Email" />
            <input id="password" type="password" placeholder="Password" />
            <div class="btn-row">
              <button class="action" onclick="register()">Register</button>
              <button class="action alt" onclick="login()">Login</button>
            </div>
            <p id="authStatus"></p>
          </div>
        </section>

        <section class="card">
          <h2>Admin Product Upload</h2>
          <div class="stack">
            <input id="productName" placeholder="Product name" />
            <textarea id="productDescription" placeholder="Description"></textarea>
            <input id="productPrice" type="number" placeholder="Price" />
            <input id="productStock" type="number" placeholder="Stock" />
            <button class="action" onclick="createProduct()">Create Product</button>
          </div>
        </section>
      </aside>

      <section class="stack">
        <section class="card hero">
          <div>
            <h1>Big Savings Days</h1>
            <p>Clone storefront powered by your existing API backend.</p>
          </div>
          <span class="pill">Up to 70% Off</span>
        </section>

        <section class="card">
          <div class="status-head">
            <h2>Products</h2>
            <button class="action alt" onclick="loadProducts()">Refresh Products</button>
          </div>
          <p id="searchSummary" class="search-summary" aria-live="polite"></p>
          <div id="products" class="products-grid"></div>
        </section>

        <section class="card status-card">
          <div class="status-head">
            <h2>Cart & Checkout</h2>
            <div class="btn-row">
              <button class="action alt" onclick="loadCart()">View Cart</button>
              <button class="action" onclick="checkout()">Checkout</button>
            </div>
          </div>
          <pre id="cart"></pre>
        </section>

        <section class="card status-card">
          <div class="status-head">
            <h2>Order Tracking</h2>
            <button class="action alt" onclick="loadOrders()">My Orders</button>
          </div>
          <pre id="orders"></pre>
        </section>
      </section>
    </main>

    <script>
      const state = { token: '', role: '', products: [], searchQuery: '' };
      let searchDebounceId = null;

      function getApiBaseUrl() {
        const fromGlobal = window.API_BASE_URL;
        if (fromGlobal) return fromGlobal;

        const fromStorage = localStorage.getItem('API_BASE_URL');
        if (fromStorage) return fromStorage;

        const params = new URLSearchParams(window.location.search);
        return params.get('apiBase') || '';
      }

      function normalizeApiBaseUrl(rawBaseUrl) {
        if (!rawBaseUrl) return '';

        try {
          const parsed = new URL(rawBaseUrl);
          if (!['http:', 'https:'].includes(parsed.protocol)) {
            return '';
          }
          return rawBaseUrl.replace(/\/+$/, '');
        } catch {
          return '';
        }
      }

      const RAW_API_BASE_URL = getApiBaseUrl();
      const API_BASE_URL = normalizeApiBaseUrl(RAW_API_BASE_URL);
      const IS_GITHUB_PAGES = window.location.hostname.endsWith('github.io');
      let lastConfigErrorMessage = '';

      function showConfigError(message) {
        if (lastConfigErrorMessage === message) return;
        const status = document.getElementById('authStatus');
        status.textContent = message;
        status.style.color = 'red';
        lastConfigErrorMessage = message;
      }

      if (RAW_API_BASE_URL && !API_BASE_URL) {
        showConfigError(`Invalid API base URL "${RAW_API_BASE_URL}". Use a full http(s) URL, e.g. https://api.yourapp.com`);
      }

      function apiUrl(path) {
        if (!API_BASE_URL && IS_GITHUB_PAGES) {
          showConfigError('Set API base URL via ?apiBase=..., localStorage key API_BASE_URL, or window.API_BASE_URL.');
          return null;
        }
        return `${API_BASE_URL}${path}`;
      }

      function authHeaders() {
        return state.token ? { Authorization: `Bearer ${state.token}` } : {};
      }

      const themes = ['flipkart', 'myntra', 'dark'];
      const allowedThemes = new Set(themes);

      function updateThemeButtonLabel(theme) {
        const themeButton = document.getElementById('themeToggle');
        if (!themeButton) return;
        const formattedTheme = theme.charAt(0).toUpperCase() + theme.slice(1);
        themeButton.textContent = `Theme: ${formattedTheme}`;
      }

      function setTheme(theme, { silent = false } = {}) {
        const selectedTheme = allowedThemes.has(theme) ? theme : 'flipkart';
        document.body.setAttribute('data-theme', selectedTheme);
        localStorage.setItem('THEME', selectedTheme);
        updateThemeButtonLabel(selectedTheme);
        if (!silent) {
          setStatus(`Theme switched to ${selectedTheme}.`);
        }
      }

      function cycleTheme() {
        const currentTheme = document.body.getAttribute('data-theme') || 'flipkart';
        const currentIndex = themes.indexOf(currentTheme);
        const nextTheme = themes[(currentIndex + 1) % themes.length];
        setTheme(nextTheme);
      }

      function loadTheme() {
        const savedTheme = localStorage.getItem('THEME');
        const selectedTheme = allowedThemes.has(savedTheme) ? savedTheme : 'flipkart';
        setTheme(selectedTheme, { silent: true });
      }

      function setStatus(message, isError = false) {
        const status = document.getElementById('authStatus');
        status.textContent = message;
        status.style.color = isError ? '#d32f2f' : '#388e3c';
      }

      function requireAuth(actionName) {
        if (state.token) return true;
        setStatus(`Please login to ${actionName}.`, true);
        return false;
      }

      async function parseJsonSafely(res) {
        try {
          return await res.json();
        } catch {
          return null;
        }
      }

      async function apiRequest(path, options = {}) {
        const url = apiUrl(path);
        if (!url) return null;
        try {
          const res = await fetch(url, options);
          const data = await parseJsonSafely(res);
          return { res, data };
        } catch (error) {
          console.error('API request failed:', error);
          setStatus('Unable to connect to the API server. Check backend/API base URL and try again.', true);
          return null;
        }
      }

      function focusEmailInput() {
        const emailInput = document.getElementById('email');
        if (!emailInput) return;
        emailInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
        emailInput.focus();
      }

      async function register() {
        const result = await apiRequest('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        if (!result) return;
        await handleAuthResponse(result.res, result.data);
      }

      async function login() {
        const result = await apiRequest('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        if (!result) return;
        await handleAuthResponse(result.res, result.data);
      }

      async function handleAuthResponse(res, data) {
        if (!res.ok) {
          setStatus(data?.message || 'Authentication failed', true);
          return;
        }

        if (!data?.token || !data?.user) {
          setStatus('Authentication response was invalid.', true);
          return;
        }

        state.token = data.token;
        state.role = data.user.role;
        setStatus(`Logged in as ${data.user.email} (${data.user.role})`);
        loadProducts();
      }

      async function createProduct() {
        if (!requireAuth('create products')) return;
        const name = document.getElementById('productName').value.trim();
        const description = document.getElementById('productDescription').value.trim();
        const price = Number(document.getElementById('productPrice').value);
        const stock = Number(document.getElementById('productStock').value);

        if (!name) {
          setStatus('Product name is required.', true);
          return;
        }
        if (Number.isNaN(price) || price < 0) {
          setStatus('Price must be a non-negative number.', true);
          return;
        }
        if (Number.isNaN(stock) || stock < 0) {
          setStatus('Stock must be a non-negative number.', true);
          return;
        }

        const result = await apiRequest('/api/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify({
            name,
            description,
            price,
            stock
          })
        });
        if (!result) return;

        if (!result.res.ok) {
          setStatus(result.data?.message || 'Failed to create product.', true);
          return;
        }

        setStatus('Product created successfully.');
        await loadProducts();
      }

      function renderProducts() {
        const wrapper = document.getElementById('products');
        wrapper.innerHTML = '';
        const search = state.searchQuery.trim().toLowerCase();
        const visibleProducts = state.products.filter((product) => {
          if (!search) return true;
          const text = `${product.name} ${product.description || ''}`.toLowerCase();
          return text.includes(search);
        });

        const summary = document.getElementById('searchSummary');
        if (!state.products.length) {
          summary.textContent = 'No products yet.';
        } else if (search) {
          summary.textContent = `Showing ${visibleProducts.length} of ${state.products.length} products for "${search}".`;
        } else {
          summary.textContent = `Showing all ${state.products.length} products.`;
        }

        for (const product of visibleProducts) {
          const item = document.createElement('div');
          item.className = 'product';

          const name = document.createElement('h3');
          name.textContent = product.name;

          const desc = document.createElement('p');
          desc.className = 'meta';
          desc.textContent = product.description || 'No description available';

          const price = document.createElement('p');
          price.className = 'price';
          price.textContent = `₹${product.price}`;

          const stock = document.createElement('p');
          stock.className = 'meta';
          stock.textContent = `Stock: ${product.stock}`;

          const addButton = document.createElement('button');
          addButton.className = 'action';
          addButton.textContent = 'Add to Cart';
          addButton.onclick = () => addToCart(product._id);

          item.append(name, desc, price, stock, addButton);
          wrapper.appendChild(item);
        }

        if (!visibleProducts.length && state.products.length) {
          const empty = document.createElement('p');
          empty.className = 'meta';
          empty.textContent = 'No products match your search.';
          wrapper.appendChild(empty);
        }
      }

      function handleSearch() {
        const nextQuery = document.getElementById('searchInput').value.trim();
        clearTimeout(searchDebounceId);
        searchDebounceId = setTimeout(() => {
          state.searchQuery = nextQuery;
          renderProducts();
        }, 120);
      }

      async function loadProducts() {
        const result = await apiRequest('/api/products');
        if (!result) return;
        const products = result.data;
        if (!result.res.ok) {
          setStatus((products && products.message) || 'Unable to load products right now.', true);
          return;
        }
        if (!Array.isArray(products)) {
          setStatus('Unable to display products. Please try again later.', true);
          return;
        }
        state.products = products;
        renderProducts();
      }

      async function addToCart(productId) {
        if (!requireAuth('add items to cart')) return;
        const result = await apiRequest('/api/cart/items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify({ productId, quantity: 1 })
        });
        if (!result) return;

        if (!result.res.ok) {
          setStatus(result.data?.message || 'Could not add item to cart.', true);
          return;
        }

        setStatus('Item added to cart.');
        await loadCart();
      }

      async function loadCart() {
        if (!requireAuth('view your cart')) return;
        const result = await apiRequest('/api/cart', { headers: authHeaders() });
        if (!result) return;
        const cart = result.data;
        if (!result.res.ok) {
          setStatus((cart && cart.message) || 'Could not load cart.', true);
          return;
        }
        const cartElement = document.getElementById('cart');
        if (cartElement) {
          cartElement.textContent = JSON.stringify(cart, null, 2);
          cartElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        setStatus('Cart loaded.');
      }

      async function checkout() {
        if (!requireAuth('checkout')) return;
        const result = await apiRequest('/api/cart/checkout', {
          method: 'POST',
          headers: authHeaders()
        });
        if (!result) return;
        const data = result.data;
        if (!result.res.ok) {
          setStatus(data?.message || 'Checkout failed.', true);
          return;
        }

        await loadCart();
        await loadOrders();
        setStatus('Checkout completed and order placed.');
      }

      async function loadOrders() {
        if (!requireAuth('view your orders')) return;
        const result = await apiRequest('/api/orders', { headers: authHeaders() });
        if (!result) return;
        const orders = result.data;
        if (!result.res.ok) {
          setStatus((orders && orders.message) || 'Could not load orders.', true);
          return;
        }
        document.getElementById('orders').textContent = JSON.stringify(orders, null, 2);
        setStatus('Orders loaded.');
      }

      loadTheme();
      loadProducts();
    </script>
  </body>
</html>
